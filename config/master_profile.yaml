            incorporating DeBERTa text embeddings raised performance to 0.936 AUC
            and 0.741 F1, measuring the incremental value of linguistic signals.
          medium: "Ran a seven-configuration layer ablation showing **behavioral signals plateaued at 0.815 AUC / 0.438 F1**, while adding DeBERTa text embeddings lifted performance to **0.936 AUC / 0.741 F1**."
          short: >-
            Conducted a layer ablation showing behavioral features plateaued at
            0.815 AUC, while adding text embeddings reached 0.936 AUC / 0.741 F1.
        evidence:
          - "L6_validation/outputs/ablation_table.csv (7 configurations)"
          - "L2-only 0.716; L4-only 0.773; L5-supervised-only 0.819; L2+L4+L5 0.815; Full+L3 0.9358 / F1 0.7406 / AP 0.798"
        keywords_hit: ["ablation study", "model evaluation", "AUC-ROC", "machine learning"]
        defense: >-
          Replaces the resume's "lifting AUC from 0.683 to 0.944". Neither endpoint
          is reproducible: no ablation row equals 0.683, and the actual Full+L3 AUC
          is 0.9358, not 0.944. The 0.815 -> 0.936 framing is both correct and a
          stronger claim, because it attributes the gain to a specific layer.
        interview_risk: |
          Expect: "why did behavioral features plateau?" Good answer: L2 rules, L4
          clusters, and L5 supervised all read the same reviewer-activity fingerprint,
          so stacking them adds little (L2+L4+L5 at 0.815 is no better than
          L5-supervised alone at 0.819). Text is the first genuinely independent
          signal. The Jaccard overlap analysis in L6 supports this directly.

      - id: frd_b2
        claim_type: verified
        priority: 1
        phrasings:
          long: >-
            Fine-tuned DeBERTa-base on 423K Yelp reviews using reviewer-disjoint
            dataset splitting to prevent same-author overlap, achieving 0.93 ROC-AUC
            and 0.84 macro-F1 across 53,687 held-out reviews.
          medium: "Fine-tuned **DeBERTa-base on 423K Yelp reviews** using reviewer-disjoint splits to prevent same-author overlap, achieving **0.93 ROC-AUC and 0.84 macro-F1** on 53,687 held-out reviews."
          short: >-
            Fine-tuned DeBERTa-base on 423K Yelp reviews with reviewer-disjoint
            splits, achieving 0.93 ROC-AUC and 0.84 macro-F1.
        evidence:
          - "L3/outputs/deberta_metrics.json: auc_roc 0.9305, f1_macro_default 0.8412, f1_spam 0.7221, train 422704 / val 53468 / test 53687, unfreeze_layers 12, trainable_params 99,802,370, runtime 515.9 min"
          - "L3/l3_deberta_finetune.py group_split(): two-round StratifiedGroupKFold with assert train_users.isdisjoint(val_users/test_users)"
        keywords_hit: ["PyTorch", "transformers", "NLP", "text classification", "deep learning"]
        defense: "Directly owned DeBERTa fine-tuning, reviewer-disjoint dataset splitting, and evaluation on held-out test reviews."
        interview_risk: |
          The metrics themselves are the most defensible in the entry - exact values
          in a committed JSON, with split sizes and hyperparameters. The only
          exposure is the ownership question, and an interviewer asking "what did you
          personally do on this project?" is guaranteed.

      - id: frd_b6
        claim_type: verified
        priority: 2
        phrasings:
          long: >-
            Diagnosed a DeBERTa training failure where a frozen-backbone
            configuration collapsed macro-F1 to 0.44, resolving it through
            unfreezing transformer layers, tuning learning rates, and validating
            precision to achieve 0.84 macro-F1.
          medium: "Diagnosed a DeBERTa optimization failure that collapsed macro-F1 to 0.44, **recovering to 0.84 macro-F1** by unfreezing backbone layers and optimizing learning-rate schedules."
          short: >-
            Recovered DeBERTa macro-F1 from 0.44 to 0.84 by unfreezing backbone
            layers and tuning optimization schedules.
        evidence:
          - "L3/L3_colab.ipynb: deberta-v3-base, auc_roc 0.5013, f1_spam_default 0.0"
          - "L3/deberta_finetune_notebook.ipynb: frozen backbone, head only (~1,540 trainable params), AUC 0.7421"
          - "L3/l3_deberta_finetune_v2.py docstring: 'v3 + bf16 sidesteps the v3+fp16 NaN issue'"
        keywords_hit: ["deep learning", "debugging", "PyTorch", "transformers"]
        defense: "Diagnosed DeBERTa optimization failure under frozen backbone / precision settings; recovered to 0.84 macro-F1 on test reviews."
        interview_risk: |
          A failure-to-fix narrative is worth more than a clean result if you can tell
          it precisely. Know why fp16 breaks DeBERTa-v3 specifically (its
          disentangled-attention arithmetic overflows in half precision) and why
          full unfreezing beat a frozen backbone here (spam style is a domain shift
          the pretrained representation does not already encode).

      - id: frd_b5
        claim_type: verified
        priority: 2
        phrasings:
          medium: >-
            Prevented target leakage by auditing every engineered feature for
            label derivation and excluding reviewer and seller spam counts and spam
            rates - features computed from labels across the full corpus that would
            have inflated every downstream metric.
          short: >-
            Prevented target leakage by excluding reviewer and seller spam-rate
            features that were derived from labels across the full corpus.
        evidence:
          - "L3/l3_deberta_finetune_v2.py LEAKAGE NOTE: reviewer_profiles.{spam_count,spam_rate} and seller_profiles.{spam_reviews,spam_rate,suspicious_reviewer_fraction} excluded"
          - "USER_META and PROD_META constants exclude those columns explicitly"
        keywords_hit: ["data leakage", "feature engineering", "machine learning"]
        defense: ""
        interview_risk: |
          Strong rigor signal and cheap to defend. The point: spam_rate is computed
          from is_spam over the whole corpus, so a model given it is reading the
          answer key. Pairs well with frd_b1 since you built the profile tables that
          contain those columns.

      - id: frd_b4
        claim_type: scoped
        priority: 3
        phrasings:
          long: >-
            Designed a multi-layer fraud architecture integrating behavioral rules,
            DeBERTa text representations, and graph clustering, identifying
            synthetic probability artifacts in preliminary fusion experiments.
          medium: "Designed a multi-layer fraud architecture integrating behavioral rules, DeBERTa text representations, and graph clustering, identifying synthetic probability artifacts in preliminary fusion experiments."
          short: >-
            Designed a multi-layer fraud architecture integrating behavioral
            rules, DeBERTa text representations, and graph clustering.
        evidence:
          - "L6_validation/02_synthetic_injection.py: TIER_COUNTS = easy 15, medium 15, hard 40"
          - "L6_validation/outputs/l6_validation_summary.txt: hard-tier L2 0.00, L4-kmeans 0.00, L4-dbscan 0.17, L5-anomaly 0.05, L5-supervised 0.33"
        keywords_hit: ["adversarial robustness", "anomaly detection", "model evaluation"]
        defense: "Team-level multi-layer architecture design; synthetic probability artifact identified in ablation."
        interview_risk: |
          CAUTION: the synthetic harness does not use real DeBERTa scores - the
          deberta_spam_prob field for synthetic profiles is sampled from per-tier
          uniform distributions in 02_synthetic_injection.py, and
          l6_validation_summary.txt states "L3 signal absent until DeBERTa
          fine-tuning completes on HPC". So any L3 detection rate from this harness
          is simulated, not measured. Only quote the behavioral-layer numbers, and
          say "simulated text signal" if the topic comes up.

      - id: frd_b7
        claim_type: scoped
        priority: 3
        phrasings:
          long: >-
            Evaluated signal overlap across behavioral and text layers using
            Jaccard similarity metrics, analyzing where text and behavioral
            classifiers agreed or diverged across fraud sub-populations.
          medium: "Evaluated signal overlap across behavioral and text layers using **Jaccard similarity metrics**, analyzing detection concordance and divergence across fraud sub-populations."
          short: >-
            Evaluated signal overlap across behavioral and text layers using
            Jaccard similarity metrics.
        evidence:
          - "L6_validation/03_summary_report.py; l6_validation_summary.txt Jaccard stability table across K = 500..10000"
          - "L3-text vs L5-supervised J = 0.785 at K=5000; L4-dbscan vs L5-supervised J = 0.007"
        keywords_hit: ["model evaluation", "clustering", "machine learning"]
        defense: "Team-level signal independence analysis across behavioral and text layers."
        interview_risk: >-
          Note the L3-vs-L5 Jaccard is high (0.785 at K=5000), which slightly
          undercuts the "text is independent" story - be ready to reconcile that with
          the ablation gain.

    known_gaps:
      - id: frd_gap_l3_l6_ownership
        severity: high
        status: resolved
        detail: >-
          RESOLVED 2026-09-13: Authoritative user clarification confirms Himanshu
          was heavily involved in DeBERTa fine-tuning, reviewer-disjoint dataset
          splitting, evaluation, and optimization. frd_b2 is directly owned and
          verified; frd_b6 is verified; frd_b4 and frd_b7 are scoped team bullets.
        fix: "Authoritative user confirmation recorded; ownership block removed."
      - id: frd_gap_resume_metrics_wrong
        severity: high
        detail: >-
          The current resume says the pipeline lifted "AUC from 0.683 to 0.944".
          Neither number appears in ablation_table.csv: there is no 0.683 row, and
          the Full+L3 configuration scores 0.9358. The F1 of 0.741 is correct.
        fix: "Use 0.815 -> 0.936 (behavioral-only to full). Never render 0.683 or 0.944."
      - id: frd_gap_stale_docstring
        severity: low
        detail: >-
          02_synthetic_injection.py's docstring says 40 profiles with a hard tier of
          10, but TIER_COUNTS in the same file is easy 15 / medium 15 / hard 40 = 70.
          The code is authoritative; the docstring is stale. Anyone reading the repo
          after seeing "70" on the resume will hit this contradiction.
        fix: "Update the docstring to match TIER_COUNTS before linking the repo."
      - id: frd_gap_simulated_l3_in_l6
        severity: medium
        detail: >-
          The synthetic-injection harness fabricates deberta_spam_prob from per-tier
          uniform distributions instead of scoring synthetic text with the real
          model, and the L6 summary was generated while the DeBERTa run was still
          pending. Any L3 row in the synthetic detection matrix is simulated.
        fix: "Re-run 02_synthetic_injection.py with real model scores, or state the limitation whenever the adversarial results come up."

