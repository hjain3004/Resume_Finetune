        fix: "Update the docstring to match TIER_COUNTS before linking the repo."
      - id: frd_gap_simulated_l3_in_l6
        severity: medium
        detail: >-
          The synthetic-injection harness fabricates deberta_spam_prob from per-tier
          uniform distributions instead of scoring synthetic text with the real
          model, and the L6 summary was generated while the DeBERTa run was still
