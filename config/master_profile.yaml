        evidence:
          - "src/audit/: deterministic source, export, database, and LLM invariant modules"
          - "scripts/audit.py: audit CLI and structured JSON report generation"
          - "docs/ROADMAP.md Phase 1 and docs/SELF_HEALING.md: 14-invariant contract and operational response policy"
        keywords_hit: ["observability", "data quality", "auditability", "schema validation", "reliability"]
        defense: ""
        interview_risk: |
          The audit detects and reports degradation; it does not autonomously repair
          every failure. The 2026-09-08 live audit correctly failed on known resolver
          coverage and missing historical traces. Call it self-monitoring or
          fail-closed auditing, not a fully self-healing production service.

      - id: rft_b13_research_banks
        claim_type: verified
        priority: 3
        phrasings:
          long: >-
            Built versioned company and resume evidence banks with strict schemas,
            source-quote anchoring, domain and privacy policy checks, duplicate
