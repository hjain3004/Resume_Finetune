      challenge_baseline_u_norm: { value: 0.18, provenance: unsourced, renderable: false }

    bullets:

      - id: sepsis_b1
        claim_type: scoped
        priority: 1
        phrasings:
          long: >-
            Led a four-person team building an early sepsis prediction system
            across 40,336 ICU patients and 40 raw clinical signals, establishing
            patient-disjoint splits and feature pipelines targeting onset six
            hours prior to clinical suspicion, scoring 0.439 normalized clinical
            utility on a held-out split.
          medium: "Led a four-person team building an **early sepsis prediction system across 40,336 ICU patients**, establishing patient-disjoint splits and feature pipelines targeting onset **six hours prior to clinical suspicion**."
          short: >-
            Led a four-person team building an early sepsis prediction system
            across 40,336 ICU patients, predicting onset six hours ahead.
        evidence:
          - "results/final_results.csv (Ensemble U_norm = 0.4387)"
          - "README.md results table"
        keywords_hit: ["machine learning", "time series", "healthcare AI", "technical leadership"]
        defense: >-
          "Led" is supported by the technical-lead role and personal ownership of
          the GRU-D model and ensemble; preprocessing, tabular baselines, and
          reporting were shared. If asked what was yours specifically, name those
          two components and do not claim the pipeline end-to-end.
        interview_risk: |
          The earlier phrasing ("2.4x the official PhysioNet challenge baseline",
          "matching top submissions") is REMOVED and must not return. The 13th-place
          team in the actual challenge scored 0.321 on the full hidden test set and
          the top scores were around 0.36 - so a 0.439 presented as comparable reads
          as either a leakage bug or an inflated claim, and invites exactly the
          scrutiny you cannot survive. Naming the metric is fine; ranking against
          the leaderboard is not. See known_gaps.sep_gap_benchmark_comparison.

      - id: sepsis_b2
        claim_type: verified
        priority: 1
        phrasings:
          long: >-
            Implemented and trained a GRU-D recurrent neural network in PyTorch
            that explicitly models irregular clinical observation intervals and
            decay towards empirical means across 40 clinical variables,
            achieving 0.400 normalized utility on PhysioNet 2019 data as the
            study's top-performing individual model.
          medium: "Trained a **PyTorch GRU-D network** that explicitly modeled irregular clinical sampling and decay dynamics, achieving **0.400 normalized utility** on 40 clinical variables as the study's top individual model."
          short: >-
            Trained a PyTorch GRU-D network modeling irregular clinical sampling
            intervals, achieving 0.400 normalized utility on 40 variables.
        evidence:
          - "notebooks/grud_new.ipynb (GRUDCell, GRUDModel)"
          - "results/final_results.csv (GRU-D U_norm = 0.4003)"
        keywords_hit: ["PyTorch", "recurrent neural network", "GRU", "deep learning", "time series"]
        defense: ""
        interview_risk: |
          "From the paper" invites "which paper?" - Che et al., Recurrent Neural
          Networks for Multivariate Time Series with Missing Values (2018). Know
          the three GRU-D inputs cold: the value, the mask, and the time delta;
          decay pulls unobserved features toward the empirical mean over time.
          Be ready for "why not just forward-fill?" - forward-fill asserts a stale
          value is current; the decay learns how fast each signal goes stale.

      - id: sepsis_b3
        claim_type: verified
        priority: 1
        phrasings:
          long: >-
            Designed a calibrated meta-stacking ensemble that isotonically calibrates
            XGBoost and GRU-D outputs, joins them per patient-hour, and fuses them
            through a logistic-regression stacker, lifting normalized utility about
            10% over the best single model by combining errors that were decorrelated
            between the tree and recurrent branches.
          medium: "Designed a **calibrated meta-stacking ensemble** isotonically calibrating XGBoost and GRU-D outputs and fusing them through a logistic-regression stacker, **lifting normalized utility about 10%** over the best single model."
          short: >-
            Built a calibrated meta-stacking ensemble fusing XGBoost and GRU-D
            through isotonic calibration and a logistic-regression stacker.
        evidence:
          - "notebooks/sepsis_ensemble.ipynb"
          - "results/final_results.csv (0.4387 vs GRU-D 0.4003 = +9.6%)"
        keywords_hit: ["ensemble learning", "model calibration", "XGBoost", "scikit-learn"]
        defense: >-
          The "+23% over XGBoost" framing from the source draft is dropped: Random
          Forest (0.376) outscored XGBoost (0.356), so benchmarking the ensemble
          against the weaker tree model is cherry-picking. The +10% over the best
          single model is the honest comparison.
        interview_risk: |
          Expect: "why stack XGBoost rather than Random Forest, when RF scored
          higher?" Have a real answer - either XGBoost calibrated better, or its
          errors decorrelated more with GRU-D. If you do not know, say you would
          check it, and note that RF-vs-XGB in the stack is an untested variant.
          Also expect: "why isotonic and not Platt scaling?" - isotonic is
          non-parametric and handles the sigmoid-shaped miscalibration typical of
          boosted trees, at the cost of needing more calibration data.

      - id: sepsis_b5
        claim_type: verified
        priority: 1
        phrasings:
          long: >-
            Conducted an ablation demonstrating that removing the ICU
            length-of-stay feature collapsed Random Forest utility from 0.320 to
            -0.006, uncovering a temporal shortcut that can artificially inflate
            evaluation scores in retrospective sepsis modeling.
          medium: "Ran an ablation showing that removing ICU length-of-stay collapsed Random Forest utility from 0.320 to -0.006, **exposing a temporal shortcut** that artificially inflates retrospective sepsis models."
          short: >-
            Identified a temporal shortcut via ablation, showing that removing
            ICU length-of-stay collapsed model utility from 0.320 to -0.006.
        evidence:
          - "results/iculos_ablation.csv (RF with ICULOS 0.3204, without -0.0063)"
        keywords_hit: ["ablation study", "data leakage", "model evaluation", "machine learning"]
        defense: ""
        interview_risk: |
          STRONGEST bullet in the entry and the most double-edged. A sharp
          interviewer will immediately ask: "then does your headline 0.439 also
          depend on that shortcut?" It does. Answer it before they ask - "yes, and
          that is the point of running the ablation: we measured our own exposure
          rather than reporting the flattering number alone." The published-lit
          claim is broad; soften to "a shortcut that is easy to leave in and hard
          to notice" if you cannot cite specific papers.

      - id: sepsis_b4
        claim_type: verified
        priority: 2
        phrasings:
          long: >-
            Resolved severe training divergence under 44:1 class imbalance by
            introducing positive-class loss weighting, 200-step learning-rate
            warmup, gradient-norm clipping, and logit clamping, stabilizing
            PyTorch GRU-D optimization toward convergence under AUPRC-gated early
            stopping.
          medium: "Overcame severe training divergence under **44:1 class imbalance** by combining **positive-class loss weighting, warmup, and gradient clipping**, stabilizing GRU-D optimization toward convergence."
          short: >-
            Stabilized divergent GRU-D training under 44:1 class imbalance using
            positive-class weighting, warmup, and gradient clipping.
        evidence:
          - "notebooks/grud_new.ipynb training cell: pos_weight, WARMUP_STEPS=200, clip_grad_norm_=1.0, logit clamp +/-15, recurrent dropout mask"
        keywords_hit: ["deep learning", "PyTorch", "class imbalance", "hyperparameter tuning"]
        defense: ""
        interview_risk: |
          Be able to say what "divergent" meant concretely - NaN loss, exploding
          logits, or collapse to the majority class - and which intervention fixed
          which symptom. A list of techniques without a failure story reads as
          copied from a tutorial.

      - id: sepsis_b6
        claim_type: verified
        priority: 2
        phrasings:
          long: >-
            Evaluated cross-hospital generalization by training XGBoost on
            Hospital A and evaluating on Hospital B, achieving 0.880 ROC-AUC and
            detecting 88.5% of sepsis cases within a six-hour window, while
            documenting the elevated false-alarm burden inherent to geographic
            transfer.
          medium: "Evaluated cross-hospital generalization by testing an **XGBoost model on an external hospital**, achieving **0.880 ROC-AUC and 88.5% sensitivity** six hours prior to clinical onset."
          short: >-
            Achieved 0.880 ROC-AUC and 88.5% sensitivity six hours before sepsis
            onset when evaluating an XGBoost model across hospitals."
        evidence:
          - "results/lead_time_summary.csv (Hospital B, RF: median 32.0h, fraction >=6h = 0.891, 1142 septic patients)"
        keywords_hit: ["model evaluation", "healthcare AI", "predictive modeling"]
        defense: >-
          "Second hospital system" is training set B of the PhysioNet public data,
          not the challenge's censored hospital C. Genuine cross-site validation,
          but not the hardest available test - do not imply otherwise.
        interview_risk: |
          Hospital B lead time (32h) is far longer than Hospital A (9h), which
          usually signals a cohort difference rather than a better model - different
          admission patterns or charting behavior. Have a hypothesis ready; being
          suspicious of your own favorable number is the impressive move here.
          Note that in the real challenge, the unseen hospital C is where nearly
          every team's score went negative.

      - id: sepsis_b7
        claim_type: verified
        priority: 3
        phrasings:
          long: >-
            Benchmarked ML models against rule-based clinical scoring baselines
            on PhysioNet 2019 data, showing that asymmetric utility penalization
            resulted in negative utility scores (-0.052 for qSOFA and -0.024 for
            NEWS) due to late warnings and high false-positive rates.
          medium: "Benchmarked ML models against **rule-based clinical baselines (qSOFA and NEWS)** under PhysioNet utility metrics, demonstrating that high false-alarm rates drove baseline clinical utility below zero."
          short: >-
            Demonstrated that rule-based scoring baselines (qSOFA, NEWS) scored
            negative utility under PhysioNet evaluation metrics."
        evidence:
          - "results/rule_baselines.csv (qSOFA >=2: U_norm -0.2426; NEWS >=5: U_norm -0.4630)"
        keywords_hit: ["model evaluation", "clinical machine learning", "healthcare AI"]
        defense: ""
        interview_risk: |
          Know what the rules are: qSOFA is respiratory rate, systolic BP, and
          altered mentation; NEWS aggregates seven vitals. Negative utility means
          the rule fires so often and so late that the metric's false-alarm and
          late-prediction penalties exceed its credit - worth stating plainly,
          because "the clinical baseline scored below zero" sounds implausible
          until you explain the metric is asymmetric.

      - id: sepsis_b8
        claim_type: scoped
        priority: 3
        phrasings:
          long: >-
            Engineered a 175-feature clinical pipeline across 40 raw physiological
            signals, incorporating per-patient forward imputation, rolling
            statistics, delta features, and measurement frequencies computed
            strictly within patient-disjoint splits.
          medium: "Built a **175-feature clinical pipeline** over 40 raw physiological signals with rolling statistics and measurement frequencies, computed strictly within **patient-disjoint splits**."
          short: >-
            Engineered a 175-feature clinical pipeline over 40 physiological
            signals evaluated strictly across patient-disjoint splits.
        evidence:
          - "notebooks/sepsis_corrected.ipynb"
          - "README.md Method Summary section 1"
        keywords_hit: ["feature engineering", "data preprocessing", "time series", "pandas"]
        defense: >-
          Shared work across the team; use "built" only in the collective sense or
          soften to "contributed to". Do not pair this with sepsis_b1's "led" in a
          way that implies sole authorship of both.
        interview_risk: |
          "Leakage-safe" will be tested: the answer is that the patient-level split
          happens BEFORE any fitting, so imputation statistics and scalers are fit
          on train patients only, and no patient appears in two splits. Note the
          tension with sepsis_b5 - the pipeline was leakage-safe in the split sense
          while still carrying the ICULOS shortcut, which is a different failure.

      - id: sepsis_b10
        claim_type: scoped
        priority: 3
        phrasings:
          medium: >-
            Interpreted model behavior with SHAP attribution and 30+ per-patient
            trajectory case studies spanning true positives, false positives, and
            missed cases, turning opaque risk scores into clinically reviewable
            evidence.
          short: >-
            Interpreted model behavior with SHAP attribution and 30+ per-patient
            trajectory case studies across true positives, false positives, and misses.
        evidence:
          - "figures/shap_xgb_summary_latest.png, figures/shap_rf_summary_latest.png"
          - "results/figures/case_studies/ (33 plots)"
        keywords_hit: ["SHAP", "model interpretability", "explainable AI"]
        defense: "Shared work; phrase as team analysis if pressed."
        interview_risk: |
          Expect "what did SHAP actually tell you?" - a bullet about running SHAP
          with no finding is weak. If ICULOS ranked high in the SHAP summary, that
          is the finding, and it ties directly to sepsis_b5.

      - id: sepsis_b9
        claim_type: verified
        priority: 4
        phrasings:
          short: "Evaluated five tabular models, GRU-D, and two clinical-rule baselines on one patient-level split, tuning thresholds against asymmetric clinical utility rather than accuracy."
        evidence:
          - "results/final_results.csv (11 model rows with per-model tuned thresholds)"
        keywords_hit: ["model evaluation", "machine learning", "hyperparameter tuning"]
        defense: ""
        interview_risk: "Low risk. Drop early under space pressure - it is breadth, not depth."

      - id: sepsis_b11
        claim_type: verified
        priority: 4
        phrasings:
          long: >-
            Built a documented experiment pipeline organizing modular feature
            generation, model training, and evaluation scripts with fixed seeds to
            support consistent ablation tracking and model comparison.
          medium: "Built a **documented experiment pipeline** organizing modular feature generation, model training, and evaluation scripts to support **consistent ablation tracking**."
          short: >-
            Built a documented experiment pipeline organizing modular feature
            generation, training, and evaluation scripts."
        evidence:
          - "README.md Setup and How to Run; SEED=42 across notebooks; models/ artifacts"
        keywords_hit: ["reproducibility", "Python", "Jupyter"]
        defense: ""
        interview_risk: >-
          Only usable once the sanitized public repo exists - claiming
          reproducibility for a repo nobody can open is a weak position.

    talking_points:
      - "Why utility and not accuracy: the PhysioNet metric rewards early alarms and penalizes late ones and false alarms asymmetrically, so a 0.21 F1 with 0.44 utility is a better clinical model than a higher-F1 late predictor."
      - "AUPRC 0.110 looks low until you note the positive rate is 2.17% - that is roughly 5x the prevalence baseline, which is the right frame of reference for a rare-event detector."
      - "The ICULOS ablation is the most interesting finding: much of the reported performance in this problem space is a time-in-ICU shortcut rather than physiology."
      - "GRU-D vs plain GRU: masking plus time-delta decay lets the model treat 'this lab was not ordered' as signal, which matters because measurement frequency itself encodes clinician concern."
      - "The ensemble gain came from decorrelation - the tree model and the recurrent model fail on different patients, which is why the stacker beats both."
      - "Hospital B was opened once, at the end, and never touched during development."

    known_gaps:
      - id: sep_gap_benchmark_comparison
        severity: high
        detail: >-
          The source draft claimed 0.439 was "2.4x the official PhysioNet 2019
          challenge baseline" (0.18), and an earlier resume said it "matched top
          submissions". Both are withdrawn. The 0.18 figure has no evidence pointer.
          More importantly the comparison is invalid: challenge scores come from a
          censored hidden test set spanning three hospital systems, while 0.439 is a
          held-out split of the public training data. For calibration, the team
          placing 13th of 78 scored 0.321 overall on the full hidden test set, with
          the top of the leaderboard near 0.36 - so a 0.439 presented as comparable
          implies beating the winner, which no reviewer will believe.
        fix: >-
          Name the metric, never the ranking. Approved phrasing: "0.439 normalized
          clinical utility on a held-out patient-level split under the PhysioNet 2019
          evaluation metric." Any variant containing "baseline", "challenge
          leaderboard", "top submissions", or a multiple thereof is a build failure.
      - id: sep_gap_no_public_repo
        severity: high
        detail: >-
          Repo is private because the notebooks embed PhysioNet patient records.
          Every other project entry carries a clickable link; this one currently
          cannot, which materially reduces its value on the page.
        fix: >-
          Publish a sanitized companion repo: code, README, results CSVs, and
          figures, with all .psv data files and notebook outputs containing patient
          rows removed. Then set links.repo and flip public to true.
      - id: sep_gap_iculos_dependency
        severity: medium
        detail: >-
          The ICULOS ablation implies the headline utility numbers themselves lean
          on the length-of-stay shortcut. sepsis_b1 and sepsis_b5 are therefore in
          tension when rendered together.
        fix: >-
          Render both anyway - owning the tension is stronger than hiding it - but
          rehearse the answer. Consider re-running the ensemble without ICULOS and
          reporting that number; a lower but shortcut-free result would be a
          genuinely better bullet than the current one.
      - id: sep_gap_model_selection
        severity: low
        detail: >-
          Random Forest (0.376) outscored XGBoost (0.356) among tabular models, yet
          the ensemble stacks XGBoost. The choice is currently unexplained.
        fix: "Check the calibration curves and error correlation; if RF stacks better, re-run and update the bullet."

