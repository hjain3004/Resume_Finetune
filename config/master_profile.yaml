        keywords_hit: ["atomic operations", "transactional publication", "fault tolerance", "failure injection", "Python"]
        defense: ""
        interview_risk: |
          Filesystems do not provide a general multi-file atomic transaction. The
          design creates one externally visible commit point through indirection or
          installs the sidecar before the final JD path. Describe the achieved
          visible-state invariant, not universal filesystem atomicity.

      - id: rft_b11_multi_provider
        claim_type: verified
        priority: 2
        phrasings:
          long: >-
            Built a multi-provider model boundary for Claude, Gemini, and OpenAI,
            normalizing tool-free invocation, credential preflight, bounded error
            diagnostics, strict response extraction, provider/model trace labels,
            and prompt-injection authority canaries behind one typed interface.
          medium: >-
            Built one **typed model interface for Claude, Gemini, and OpenAI** with
