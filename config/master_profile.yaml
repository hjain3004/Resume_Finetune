          - "src/tailor/invoke.py: Claude subprocess plus direct Gemini and OpenAI HTTP invocation adapters"
          - "tests/tailor/test_providers.py and tests/tailor/test_invoke.py: deterministic provider, security, and error-path coverage"
        keywords_hit: ["Claude", "Gemini", "OpenAI", "REST API", "LLM orchestration", "security"]
        defense: ""
        interview_risk: |
          Multi-provider support means a shared execution contract, not identical
          output quality or feature parity. Claude uses a locked-down CLI process;
          Gemini and OpenAI use direct HTTP APIs. Live provider quality still
