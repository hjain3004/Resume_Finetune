  - id: amdocs_software_developer
    employer: "Amdocs Ltd."             # entity suffix: Greenhouse parse rule
    title: "Software Developer"         # NEVER altered. Target-title seeding
                                        # happens in the summary line only.
    location: "Gurugram, India"
    start: "2023-07"
    end: "2025-06"
    display_date: "July 2023 - June 2025"
    role: "Backend developer on the OpenShift integration team"
    ownership_boundary: "Backend microservices and data pipelines"
    status: completed

    # Printed as a one-line italic scope note under the header. Front-loads the
    # stack for keyword search and gives the reader domain context in one pass.
    scope_line: >-
      Order Management domain (Catalog, Shopping Cart, Proposal and Agreement) -
      Java and Spring Boot microservices on Apache Kafka, Couchbase, and
      Elasticsearch, deployed through Jenkins pipelines to OpenShift.

    keywords:
      exact: ["Java", "Spring Boot", "Apache Kafka", "microservices", "REST API",
              "Elasticsearch", "Couchbase", "Jenkins", "CI/CD", "OpenShift",
              "Kubernetes", "HELM", "AWS", "JUnit", "Mockito", "SonarQube"]
      topical: ["event-driven architecture", "dead letter queue", "distributed systems",
                "authorization", "multi-tenancy", "JWT", "OAuth2", "audit trail",
                "data retention", "observability", "test automation", "feature flags"]
      # Fintech translation layer. These are the terms a fintech JD uses for
      # work Himanshu did under telecom vocabulary. The scorer should treat a
      # match here as strong, and the tailoring model should prefer the variant
      # that surfaces the mapped term.
      domain_translation:
        "data fencing": "row-level entitlement / multi-tenant authorization"
        "proposal tracking": "immutable audit trail / books-and-records"
        "purge and archive": "data retention and records management policy"
        "DLQ consolidation": "event-driven reliability and failure handling"

    # -------------------------------------------------------------------------
    # METRIC LEDGER -- read this before selecting any bullet with a number.
    # -------------------------------------------------------------------------
    # doc_backed  -> appears in the source material; assert plainly.
    # estimated   -> reconstructed from before/after reasoning two years later.
    #                Render only with a hedge-compatible variant, and the
    #                defense string must survive a 30-second challenge.
    #
    # RULE: a resume may carry at most TWO estimated metrics. Beyond that the
    # page reads as uniformly confident and a reviewer cannot tell which
    # numbers are real. The audit suite enforces this cap.
    # -------------------------------------------------------------------------
    metric_ledger:
      dlq_topic_count:      { value: 862,  provenance: doc_backed, renderable: true }
      dlq_deployments:      { value: 11,   provenance: doc_backed, renderable: true }
      dlq_partition_share:  { value: "5%", provenance: doc_backed, renderable: true }
      dlq_idle_reduction:   { value: "70%", provenance: doc_backed, renderable: true }
      dlq_partition_reclaim: { value: "80%", provenance: doc_backed, renderable: true }
      unit_test_coverage:   { value: "90%", provenance: doc_backed, renderable: true }
      sonarqube_smells:     { value: "~500", provenance: doc_backed, renderable: true }
      purge_footprint:      { value: "~40%", provenance: estimated, renderable: false }
      purge_query_gain:     { value: "~25%", provenance: estimated, renderable: false }
      qa_effort_reduction:  { value: "~50%", provenance: estimated, renderable: false }
      defect_reduction:     { value: "~40%", provenance: estimated, renderable: false }
      resolution_time_gain: { value: "~60%", provenance: estimated, renderable: false }

    bullets:

      - id: am_b01_dlq_consolidation
        claim_type: verified
        priority: 1                     # strongest bullet; lead with it always
        phrasings:
          long: >-
            Redesigned the Apache Kafka dead-letter-queue architecture for the
            Order Management domain, consolidating 862 per-consumer DLQ topics
            across 11 deployments into one shared DLQ per subdomain via a new
            HELM binding function with a feature-flagged, zero-downtime rollout -
            cutting idle topic sprawl by 70% and reclaiming roughly 80% of the
            partitions held by empty DLQs.
          medium: >-
            Redesigned the Kafka dead-letter-queue architecture, consolidating
            862 per-consumer DLQ topics across 11 deployments into one shared DLQ
            per subdomain behind a feature-flagged HELM binding function - cutting
            idle topic sprawl by 70% and reclaiming ~80% of wasted partitions.
          short: >-
            Consolidated 862 per-consumer Kafka dead-letter topics into shared
            per-subdomain DLQs via a feature-flagged HELM function, cutting idle
            topic sprawl by 70%.
        evidence:
          - "Interview prep doc, DLQ section: instanceBind HELM function, sharedDlqTopicsEnabled flag defaulting false, error.<subdomain> naming"
          - "Migration runbook: enable flag -> drain under retention -> cleanup script -> rollback via flag or per-topic dlqTopicName override"
          - "D1 test suite defect found and fixed: HELM function reading wrong values path"
        keywords_hit: ["Apache Kafka", "HELM", "event-driven architecture", "dead letter queue", "feature flags", "Kubernetes"]
        defense: ""
        interview_risk: |
          Expect: "how do you know which consumer a failed message came from?"
          Answer: Spring Kafka's DeadLetterPublishingRecoverer stamps
          kafka_dlt-original-topic/-partition/-offset plus exception class, so
          the shared DLQ is self-describing and replay filters on those headers.
          Expect: noisy-neighbor objection. Answer: per-topic dlqTopicName
          override existed; DLQ traffic is exceptional by definition.
          Boundary: broker internals were a platform team's. Say so.

      - id: am_b02_row_level_entitlement
        claim_type: verified
        priority: 1
        phrasings:
          long: >-
            Co-built a modular Java row-level entitlement library for the shared
            microservices base, chaining JSON Web Token (JWT) claim validators for
            multi-tenant telecom operators, and integrated it at the Proposal and
            Agreement delegate layer - pushing claim predicates directly into
            Couchbase N1QL and Elasticsearch queries behind new secondary indexes
            so the database returned only authorized rows, failing closed with
            HTTP 403 on claim mismatch.
          medium: >-
            Co-built a Java row-level entitlement library chaining JSON Web Token
            (JWT) claim validators for multi-tenant operators, pushing claim
            predicates into Couchbase N1QL and Elasticsearch queries behind new
            secondary indexes so only authorized rows were returned, failing
            closed with HTTP 403.
          short: >-
            Co-built a Java row-level entitlement library chaining JWT claim
            validators, pre-filtering authorized rows at the database layer and
            failing closed with HTTP 403.
        evidence:
          - "Prep doc, data fencing section: CustomerIdValidator, MultiCustomerIdValidator, ExtUserAccessGroupIdListValidator (highest priority, fail-closed)"
          - "datafencing.extensions.customValidators flag making single- and multi-customer validators mutually exclusive"
          - "updateResource() hook stamping caller access groups into new resources' ExternalIdentifier array"
        keywords_hit: ["Java", "JWT", "authorization", "multi-tenancy", "Couchbase", "Elasticsearch", "REST API"]
        defense: ""
        interview_risk: |
          "Co-built" is load-bearing - the library had multiple contributors.
          If asked what YOU built: own the Proposal and Agreement integration
          end-to-end, the pre-filtering query work, and the secondary indexes.
          Do not claim sole authorship of the validator chain.
          Prepared answer on pre- vs post-filtering: post-filtering pays network,
          deserialization, and memory for rows the user cannot see AND breaks
          pagination; pre-filtering makes claims into WHERE predicates so
          indexes do the work and pagination is correct by construction.
          RECONSTRUCTED and must stay hedged: cache TTL/size, and cross-pod
          cache coherence. Prepared line: "each instance cached locally with
          invalidation tied to the group-management endpoint; if I built it
          today I'd broadcast invalidation over Kafka with a short TTL backstop."

      - id: am_b03_audit_trail
        claim_type: estimated
        priority: 2
        phrasings:
          long: >-
            Architected an immutable audit-trail system for contract lifecycle
            events: delegate-level triggers published standardized Kafka events
            with correlation-ID propagation, and a new Proposal Tracking consumer
            enriched them with JWT-resolved actor identity and configurable action
            filtering before persisting append-only records in Elasticsearch,
            replacing multi-service log correlation with a single filtered query.
          medium: >-
            Architected an immutable audit-trail system - delegate-level Kafka
            triggers with correlation-ID propagation feeding a new consumer that
            persisted append-only, actor-attributed records in Elasticsearch -
            replacing multi-service log correlation with one filtered query.
          short: >-
            Built an immutable audit trail for contract lifecycle events using
            Kafka triggers and append-only Elasticsearch records, replacing
            multi-service log correlation with a single query.
        evidence:
          - "Prep doc, traceability section: catalog config table driving which actions are tracked; tracking ID generation"
          - "Actor resolution: preferred_username from JWT mapped through workforce API to user ID"
          - "Cross-domain case: Product Order events resolved to proposalId via PO externalIdentifier array by category"
        keywords_hit: ["Apache Kafka", "Elasticsearch", "audit trail", "event-driven architecture", "observability"]
        defense: >-
          The ~60% resolution-time figure is an estimate from before/after
          support experience, not an instrumented metric: reconstructing an
          incident previously meant correlating logs across four or five
          services (hours); afterward it was one filtered query (minutes).
          NOTE: the selected variants deliberately omit the number - prefer
          these. Only reintroduce "~60%" if a specific JD rewards quantified
          operational impact, and only if it is one of at most two estimated
          metrics on the page.
        interview_risk: |
          "Immutable" is a design contract, not a database guarantee - ES docs
          are updatable. Answer: the consumer only ever creates; there is no
          update path in the API. Hardening would be index-level write-once or
          ILM roll-over to read-only.
          RECONSTRUCTED: partitioning on entity ID. Hedge with "as I recall".

      - id: am_b04_data_retention
        claim_type: estimated
        priority: 2
        phrasings:
          long: >-
            Built a policy-driven data-retention capability across three
            microservices - REST lifecycle APIs plus Kafka event-driven archival
            to a dedicated Archive service - with archive-before-delete ordering
            so a source document was removed only on a confirmed archive
            completion event, keeping the transactional store lean while archived
            agreements stayed retrievable through a dedicated API.
          medium: >-
            Built a policy-driven data-retention capability across three
            microservices using REST lifecycle APIs and Kafka event-driven
            archival, with archive-before-delete ordering so documents were
            removed only after a confirmed archive completion event.
          short: >-
            Built policy-driven data retention across three microservices with
            REST lifecycle APIs and Kafka-driven archival, using
            archive-before-delete ordering for safe purges.
        evidence:
          - "Prep doc, purge and archive section: retention rules (rejected/cancelled proposals >1mo purge; active agreements >1yr archive; rejected agreements >1mo purge)"
          - "Mass-process framework for bulk execution; Archive service completion and failure events; get-from-archive API"
        keywords_hit: ["Apache Kafka", "REST API", "microservices", "data retention", "Couchbase"]
        defense: >-
          ~40% footprint reduction reflects the eligible fraction of documents in
          terminal or archivable states under the retention rules, from rollout
          data-distribution analysis; ~25% query improvement follows from smaller
          collections and smaller secondary indexes. Both are recalled estimates,
          not reproducible measurements. Selected variants omit both numbers by
          design - the mechanism (archive-before-delete, worst case a duplicate,
          never a deleted-but-not-archived document) is the defensible part and
          is what interviewers actually probe.
        interview_risk: |
          Expect the failure-mode question: "what if archive succeeds but delete
          fails, or vice versa?" Answer is already in the bullet - ordering makes
          the dangerous direction structurally impossible.
          RECONSTRUCTED: retry idempotency on document ID. Hedge.

      - id: am_b05_test_automation
        claim_type: verified
        priority: 2
        phrasings:
          long: >-
            Automated end-to-end API testing with Postman collections executed
            headlessly through Newman in Jenkins, adding JSON-schema response
            validation to catch cross-service contract drift at build time, and
            raised unit-test coverage to 90% across four microservices using
            JUnit 5, Mockito, and WireMock stubs while clearing roughly 500
            SonarQube code smells behind enforced quality gates.
          medium: >-
            Automated end-to-end API testing with Postman and Newman in Jenkins
            with JSON-schema response validation, and raised unit-test coverage to
            90% across four microservices using JUnit 5, Mockito, and WireMock
            while clearing ~500 SonarQube code smells behind enforced quality gates.
          short: >-
            Automated end-to-end API tests via Newman in Jenkins and raised unit
            coverage to 90% across four microservices, clearing ~500 SonarQube
            code smells behind enforced quality gates.
        evidence:
          - "Prep doc, testing section: pre-request scripts for correlation IDs, pm.test assertions, per-environment variable files"
          - "WireMock scenarios: 201 happy path, 500 to verify non-blocking handling, 30s fixed delay for timeout behavior"
          - "Jenkins quality gates failing builds on new-code coverage and new critical issues"
        keywords_hit: ["Jenkins", "CI/CD", "JUnit", "Mockito", "test automation", "REST API"]
        defense: >-
          90% coverage and ~500 smells are doc-backed - assert plainly. The
          ~50% QA effort and ~40% defect figures are estimates and are
          deliberately ABSENT from all three variants. Do not add them back.
        interview_risk: |
          Expect the vanity-metric challenge on 90%. Answer: JaCoCo line coverage
          via SonarQube (hedge - RECONSTRUCTED that it was line-via-JaCoCo);
          prioritized service, delegate, and mapper layers over getter padding;
          the gate that mattered was the NEW-CODE threshold, not the absolute.

      - id: am_b06_aws_ci_and_resilience
        claim_type: verified
        priority: 3
        phrasings:
          medium: >-
            Contributed to migrating the domain's continuous integration to
            Amazon Web Services (AWS) through AWS-specific Jenkinsfiles, Maven
            profile updates, and HELM value refactors, and integrated an external
            human-task service into agreement sign-off with per-flow feature flags
            and non-blocking failure handling so a downstream outage could never
            block the core business transaction.
          short: >-
            Contributed to migrating continuous integration to Amazon Web Services
            (AWS), and integrated an external task service into sign-off with
            feature flags and non-blocking failure handling.
        evidence:
          - "Prep doc: new Jenkinsfile_Org_aws, Maven AWS profiles, HELM value changes, backward-compatible cutover"
          - "Human Task integration: rich payload mapping, dedicated task types per flow, searchable Agreement/Site IDs, warn-and-proceed on failure"
        keywords_hit: ["AWS", "Jenkins", "CI/CD", "HELM", "Maven", "feature flags"]
        defense: >-
          "Contributed to" is accurate for the AWS migration and must not be
          upgraded to "led" or "owned" - it was a domain-wide effort.
        interview_risk: |
          Expect: "fire-and-forget means tasks can be silently lost - acceptable?"
          Answer: deliberate and documented; the requirement was that task
          creation must not fail sign-off, mitigated by a surfaced warning.
          Volunteer the upgrade path (publish task creation as a Kafka event with
          a retrying consumer) - offering it unprompted reads as senior.

