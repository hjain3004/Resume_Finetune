        severity: medium
        detail: >-
          Actual title is "Software Developer"; most target postings say
          "Software Engineer". Jobscan reports a large interview-rate lift on
          job-title match.
        fix: >-
          Seed the target title in the summary line ONLY. The employment title
          in this block is immutable - altering it is resume fraud, not tailoring.
      - id: am_gap_no_code_access
        severity: medium
        detail: >-
          All evidence traces to a self-authored prep document, not to code or
          artifacts Himanshu can still access. Provenance is weaker here than for
          any project entry.
        fix: >-
          Treat mechanism claims as defensible and specific runtime details as
