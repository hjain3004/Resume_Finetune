  - id: peerchat_peer_discovery
    display_date: "Feb. 2026 - May 2026"
    name: "PeerChat - Peer Discovery Module"
    # Rendered header line. Keep <= ~95 chars so it never wraps.
    display_title: "PeerChat - Peer Discovery"
    org: "San Jose State University"
    context: >-
      Distributed systems course project built by a ~15-person class split into
      module teams (membership/discovery, message distribution, history,
      security, UI). I co-owned the peer discovery module with one teammate;
      everything claimed here lives under peer_discovery/ and is attributable to
      my commits. I did NOT build message distribution, history recovery, the
      crypto primitives, or the UI.
    role: "Co-owner, peer discovery module (2-person sub-team)"
    ownership_boundary: >-
      SAFE TO CLAIM: event log, snapshot projection, presence/failure detection,
      gossip dispatch, heartbeats, bootstrap/join handshake, protocol codec,
      trust-on-first-use pubkey planting, the transport consolidation.
      MODULE BOUNDARY: Shared BroadcastNode/WebSocket transport was co-integrated
      with the broader class architecture; history recovery, vector clocks, and UI
      belonged to other module teams. Describe the peer discovery system accurately
      within its module boundary.
    start: "2026-01"
    end: "2026-05"
    status: completed

    links:
      # TODO(himanshu): replace with the real URL you just added.
      # Prefer YOUR fork so the commit history reads as yours; if you link the
      # class repo, add "#peer_discovery" so it deep-links your directory.
      repo: "https://github.com/CHANGEME/peerchat"
      subpath: "peer_discovery/"
      # Render as visible text, not a hyperlinked word (ATS: URLs must survive
      # text extraction).
      render_as: visible_url

    tech:
      primary: ["Python", "WebSockets", "pytest"]
      secondary: ["cryptography (RSA signing)", "threading", "state machine"]
      # `tech_line` is what the renderer prints. Kept explicit so the model
      # cannot reorder or invent stack items.
      tech_line: "Python, WebSockets, cryptography, pytest"

    # Keywords the JD-matcher scores against. NOT printed. Split so the
    # scorer can weight exact-title matches higher than topical ones.
    keywords:
      exact: ["distributed systems", "peer-to-peer", "P2P", "peer discovery",
              "gossip protocol", "failure detection", "fault tolerance",
              "concurrency", "WebSockets", "Python", "unit testing"]
      topical: ["state machine", "idempotency", "deduplication", "LRU cache",
                "public key cryptography", "trust on first use",
                "eventual consistency", "backend", "systems programming"]

    # -------------------------------------------------------------------------
    # BULLET CORPUS
    # -------------------------------------------------------------------------
    # Select 2 for a standard render, 3 when this is the lead project for a
    # distributed-systems/backend role, 1 when it is the third project on an
    # ML-targeted resume.
    #
    # claim_type:
    #   verified  -> reproducible from the repo (test count, code behavior)
    #   scoped    -> true but describes team-project ownership; phrased to
    #                claim only my slice
    #   observed  -> measured once manually (two-laptop run), not in CI
    # -------------------------------------------------------------------------
    bullets:

      - id: pc_b01_event_sourcing
        claim_type: verified
        priority: 1                     # lead bullet; almost always selected
        phrasings:
          long: >-
            Designed the event-driven membership layer for a peer-to-peer chat
            system, implementing an append-only event log with deterministic
            snapshot projection and per-event state transition guards to maintain
            consistent local peer rosters across node joins, leaves, and abrupt
            disconnects.
          medium: "Designed the event-driven membership layer for a **peer-to-peer chat system**, building an **append-only event log with deterministic snapshot projection** and state transition guards to maintain consistent local peer rosters."
          short: >-
            Designed an event-driven P2P membership layer with an append-only
            event log and deterministic snapshot projection to maintain
            consistent local peer rosters.
        evidence:
          - "peer_discovery/membership/event_log.py: monotonic seq_no, RLock-guarded append, StaleTermError on term regression"
          - "peer_discovery/membership/snapshot.py: apply_event with _ALLOWED_FROM_STATES guards; zero wall-clock reads"
          - "test: build snapshot twice from same log, assert identical serialization"
        keywords_hit: ["distributed systems", "state machine", "P2P", "peer discovery"]
        defense: ""
        interview_risk: |
          "Deterministic" is scoped to a GIVEN local log. Two nodes receiving
          gossip in different orders build different local logs, and apply_event
          DROPS an illegal transition (logs a warning, returns None) rather than
          buffering it. Say "converges", never "guarantees identical". If pushed:
          "ordering is convergent under our single-originator gossip topology;
          a general solution needs per-originator sequencing or a reorder buffer."

      - id: pc_b02_network_layer
        claim_type: verified
        priority: 1
        phrasings:
          long: >-
            Implemented the full network layer - gossip dissemination with an
            (originator, sequence, type, user) dedup key over a 10,000-entry LRU
            and single-hop cycle-breaking, SWIM-inspired two-phase failure
            detection (ACTIVE to SUSPECTED to DISCONNECTED on timers), and
            trust-on-first-use public-key exchange - riding a shared WebSocket
            transport.
          medium: >-
            Implemented the network layer: gossip dissemination with LRU-backed
            dedup and single-hop cycle-breaking, SWIM-inspired two-phase failure
            detection, and trust-on-first-use public-key exchange over a shared
            WebSocket transport.
          short: >-
            Implemented gossip dissemination with LRU dedup, SWIM-inspired
            failure detection, and trust-on-first-use key exchange over
            WebSockets.
        evidence:
          - "peer_discovery/network/gossip.py: MAX_SEEN_EVENTS = 10_000; dedup key f'{originator}:{seq_no}:{event_type}:{user_id}'; source=='remote' not re-gossiped"
          - "peer_discovery/membership/presence.py: injectable time_fn; ACTIVE -> SUSPECTED -> DISCONNECTED"
          - "peer_discovery/network/discovery_node.py: lazy_register_pubkey planted on BroadcastNode.pre_verify_hook, idempotent"
        keywords_hit: ["gossip protocol", "failure detection", "deduplication", "WebSockets", "public key cryptography"]
        defense: ""
        interview_risk: |
          "SWIM-inspired" is deliberate and must NOT be upgraded to
          "SWIM-style"/"SWIM implementation". Real SWIM uses randomized probing
          with indirect ping-req; this broadcasts every heartbeat to every peer
          every 5s (full mesh) and borrows only the two-phase suspicion timer.
          Prepared answer: "broadcast heartbeats with SWIM's suspicion
          mechanism; randomized probing would be the scale upgrade."

      - id: pc_b03_testing_rigor
        claim_type: verified
        priority: 2
        phrasings:
          long: >-
            Validated the module with 92 unit and integration tests, including
            fake-clock-driven failure-detection tests that make timer behavior
            fully deterministic, a 500-append concurrency test asserting an exact
            contiguous sequence range, and a two-node end-to-end handshake test.
          medium: >-
            Validated with 92 unit and integration tests, including fake-clock
            deterministic failure-detection tests, a 500-append concurrency
            test, and a two-node end-to-end handshake.
          short: >-
            Covered the module with 92 unit and integration tests, including
            concurrency and two-node end-to-end cases.
        evidence:
          - "python3 -m pytest peer_discovery/ -q  ->  92 passed"
          - "peer_discovery/membership/tests/: FakeClock injected via PresenceManager(time_fn=...)"
          - "peer_discovery/network/tests/test_gossip.py, _helpers.FakeBroadcastNode"
        keywords_hit: ["unit testing", "integration testing", "concurrency", "pytest"]
        defense: ""
        interview_risk: |
          Strongest code-quality signal in the repo and rare for a student
          project - the injected clock is worth volunteering unprompted.
          Recount the test total before shipping if the repo has moved.

      - id: pc_b04_transport_consolidation
        claim_type: scoped
        priority: 1
        phrasings:
          long: >-
            Diagnosed a cross-machine discovery failure caused by conflicting
            parallel transports on separate ports and consolidated peer discovery
            onto a single shared WebSocket connection, eliminating a redundant TCP
            and encryption stack to simplify connection management and retry queues.
          medium: "Resolved a cross-machine discovery failure by **consolidating peer discovery onto a shared WebSocket connection**, eliminating a redundant TCP/crypto stack and leaving **one port and one retry queue**."
          short: >-
            Eliminated a redundant TCP and crypto stack by consolidating peer
            discovery onto a shared WebSocket transport.
        evidence:
          - "peer_discovery/network/gossip.py docstring: 'outbound only after the consolidation'"
          - "Commit history under Himanshu Jain: removal of the standalone discovery transport"
        keywords_hit: ["debugging", "refactoring", "distributed systems", "WebSockets"]
        defense: >-
          Scoped as a diagnosis-and-consolidation I drove within my module;
          the shared BroadcastNode transport itself was another team's component.
        interview_risk: |
          Great narrative bullet ("I deleted a whole parallel system") but only
          use it if you can name the concrete symptom: chat frames hitting the
          discovery port produced an 'Incoming frame size 1195725856' error,
          which is ASCII 'GET ' read as a length prefix.

      - id: pc_b05_tofu_bootstrap
        claim_type: verified
        priority: 3
        phrasings:
          long: >-
            Implemented trust-on-first-use public key bootstrapping via an
            idempotent pre-verification hook that extracts and registers a sender
            public key from signed incoming envelopes, verifying message
            signatures while self-populating the local key cache.
          medium: "Implemented **trust-on-first-use public key bootstrapping** through an idempotent pre-verification hook, extracting and caching sender keys from signed message envelopes to verify all incoming payloads."
          short: >-
            Implemented trust-on-first-use public key bootstrapping with an
            idempotent hook that extracts and caches keys from signed envelopes.
        evidence:
          - "peer_discovery/network/discovery_node.py: lazy_register_pubkey, registered on BroadcastNode.pre_verify_hook"
          - "Hook is idempotent (skips if registry already holds a key) and decrypts a copy rather than mutating the message"
        keywords_hit: ["public key cryptography", "trust on first use", "security", "authentication"]
        defense: ""
        interview_risk: |
          TOFU has a real known weakness - it trusts the first key it sees, so a
          man-in-the-middle at join time wins. Own it: "TOFU is vulnerable to a
          first-contact MITM; hardening needs out-of-band fingerprint
          verification or a shared room secret."

      - id: pc_b06_two_laptop_validation
        claim_type: observed
        priority: 4
        phrasings:
          short: >-
            Validated the join handshake across two physical machines on a LAN,
            with a joining node reaching ACTIVE in about 200 ms and bidirectional
            heartbeats sustained for over 30 minutes without a drop.
        evidence:
          - "Manual two-machine run on 10.0.0.0/24, 2026-05-17; not reproducible in CI"
        keywords_hit: ["distributed systems", "networking", "validation"]
        defense: >-
          Single manual observation on one LAN, not an instrumented benchmark or
          a CI-reproducible number. Present as "in our two-machine test", never
          as a performance characteristic of the system.
        interview_risk: |
          Lowest-priority bullet; drop first under space pressure. The ~200 ms
          figure is one observation - do not defend it as a latency SLO.

    # -------------------------------------------------------------------------
    # Known defects. NOT rendered. Kept here because the interview-prep
    # generator reads this block, and because shipping fixes before recruiters
    # click the repo link is a tracked task.
    # -------------------------------------------------------------------------
    known_gaps:
      - id: pc_gap_gossip_lock
        severity: medium
        detail: >-
          GossipDispatcher.seen_event_ids (OrderedDict) is mutated from both the
          notifier dispatch thread and inbound message-handler threads with no
          lock; move_to_end plus the membership check is not atomic.
        fix: "Guard _mark_seen with a threading.Lock."
      - id: pc_gap_presence_lock
        severity: medium
        detail: >-
          PresenceManager._members is written by record_heartbeat on message
          threads while check_liveness iterates on the tick thread.
        fix: "Guard the members map with a lock; the list() copy only prevents iteration crashes, not interleaved transitions."
      - id: pc_gap_dedup_key_mismatch
        severity: medium
        detail: >-
          gossip.py's docstring claims DuplicateGuard uses the same 4-part key,
          but duplicate_guard.py keys on (user_id, event_type) over a 100-entry
          window - a double-click suppressor, not cross-node idempotency. Two
          legitimate same-type events for one user inside the window can be
          suppressed.
        fix: "Either widen the guard key or correct the gossip.py docstring. Do not claim cross-restart idempotency until fixed."
      - id: pc_gap_unbounded_log
        severity: low
        detail: "MembershipEventLog._log grows without bound; get_events_since is an O(n) scan."
        fix: "Truncate below the checkpoint's as_of_seq_no, retain the tail."
      - id: pc_gap_ipv6_split
        severity: low
        detail: "bootstrap peer parsing uses peer.split(':'), which breaks on IPv6; rsplit(':', 1) is used correctly elsewhere."
        fix: "Standardize on rsplit(':', 1)."

