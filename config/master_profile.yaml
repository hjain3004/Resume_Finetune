# =============================================================================
# master_profile.yaml
# =============================================================================
# The single source of truth for every factual claim that may appear on a
# generated resume. The tailoring model SELECTS from this file; it never
# invents, rephrases beyond the provided variants, or writes markup.
#
# CONTRACT (enforce in the renderer + audit suite):
#   C1. Every bullet emitted to a .tex/Typst artifact MUST resolve to a
#       bullet_id present in this file. No free-text bullets. Ever.
#   C2. The model may only choose among `variants`. It may not edit variant
#       text. Length fitting is variant selection, not rewriting.
#   C3. Any bullet with claim_type != "verified" requires `defense` to be
#       non-empty. The audit suite fails the build if it is missing.
#   C4. All rendered text MUST be ASCII-only (see ats.charset_policy).
#       Non-ASCII in a variant is a build failure, not a warning.
#   C5. `evidence` is a code/artifact path or a reproducible command. Prose
#       assertions ("I remember doing this") are not evidence.
#
# SCHEMA VERSION: 0.2.0  -- projects + experience. Skills/summary/education
# blocks land in later milestones; stubs at the bottom mark the intended shape.
#
# claim_type enum (audit suite must reject unknown values):
#   verified              reproducible from code, config, or a committed artifact
#   scoped                true, but describes ownership inside a team effort;
#                         phrasing must claim only Himanshu's slice
#   estimated             reconstructed metric, no reproducible measurement
#   observed              measured once manually, not in CI
#   ownership_unresolved  BLOCKED. Work exists in the repo but attribution is
#                         unconfirmed. Must not render.
#   needs_input           BLOCKED. A required fact is missing and only Himanshu
#                         can supply it (employer name, dates, deploy status).
#                         Must not render.
# Any claim_type other than `verified` requires a non-empty `defense` (C3).
# =============================================================================

