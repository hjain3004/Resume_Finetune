        evidence:
          - "src/company_bank/: typed research bundles, source policy, validation, lookup, and atomic corpus importer"
          - "src/resume_evidence/: outcome evidence model, privacy and attribution policy, duplicate detection, reporting, and atomic promotion"
          - "scripts/company_bank.py and scripts/resume_evidence.py: deterministic operator CLIs"
        keywords_hit: ["data provenance", "schema validation", "privacy", "deduplication", "knowledge base"]
        defense: ""
        interview_risk: |
          These are offline evidence foundations, not a live retrieval-augmented
