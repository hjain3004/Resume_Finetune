version: 2
countries:
  allowed: [US]
  explicit_non_match: reject
  unknown_pre_resolution: defer
  unknown_post_resolution: allow_with_flag
  remote_without_country: unknown
opportunity_types:
  classification_order: [internship, co_op, contract, part_time, temporary, full_time]
  default_when_unmarked: full_time
  patterns:
    internship: ["\\bintern(ship)?\\b"]
    co_op: ["\\bco[- ]?op\\b", "\\bcooperative education\\b"]
    contract: ["\\bcontract(or)?\\b", "\\b1099\\b"]
    part_time: ["\\bpart[- ]time\\b"]
    temporary: ["\\btemporary\\b", "\\btemp\\b"]
    full_time: ["\\bfull[- ]time\\b", "\\bnew grad(uate)?\\b", "\\bgraduate\\b"]
  types:
    full_time:
      enabled: true
      start_windows:
        - {earliest: "2027-01-01", latest: "2027-12-31"}
      year_only_evidence: sufficient
      unknown_start_pre_resolution: defer
      unknown_start_post_resolution: allow_with_flag
    internship:
      enabled: true
      allowed_seasons: [spring]
      start_windows:
        - {earliest: "2027-01-01", latest: "2027-05-31"}
      year_only_evidence: insufficient
      unknown_start_pre_resolution: defer
      unknown_start_post_resolution: reject
    co_op: {enabled: false}
    contract: {enabled: false}
    part_time: {enabled: false}
    temporary: {enabled: false}
seasons:
  spring: {months: [1, 2, 3, 4, 5]}
  summer: {months: [6, 7, 8]}
  fall: {months: [9, 10, 11, 12]}
role_families:
  jd_fallback_min_hits: 2
  include:
    - name: software_engineering
      patterns:
        - "software"
        - "\\bswe\\b"
        - "backend"
        - "back.end"
        - "full.?stack"
        - "platform"
        - "infrastructure"
        - "distributed"
        - "developer"
      exclude_patterns:
        - "technician"
        - "\\bresearch scientist\\b"
        - "\\banalyst\\b"
        - "\\bauditor\\b"
        - "\\b(game\\s+)?tester\\b"
        - "casino"
seniority:
  title_exclude_patterns:
    - "senior|staff|principal|lead|manager|director"
    - "\\b(7|8|9|10)\\+?\\s*years"
  years_cap: 3
work_authorization:
  silence: allow
  ambiguous: allow_with_flag
  explicit_no_sponsorship: reject
  citizenship_required: reject
  clearance_required: reject
  patterns:
    explicit_no_sponsorship:
      - "unable to sponsor"
      - "no (?:visa )?sponsorship"
      - "will not sponsor"
      - "not.{0,30}sponsor"
      - "without sponsorship now or in the future"
    # Accept the dotted "U.S." and spelled-out "United States" forms: American postings
    # write it that way far more often than the bare "US" the original patterns assumed,
    # so the commonest phrasing of a hard citizenship bar was passing the gate.
    citizenship_required:
      - "\\bU\\.?S\\.?\\s*citizens?\\s+only"
      - "\\bmust be (?:an?\\s+)?(?:U\\.?S\\.?|United States)\\s*citizens?\\b"
      - "\\b(?:U\\.?S\\.?|United States)\\s*citizenship\\s+(?:is\\s+)?required"
    # A clearance requirement is a citizenship requirement stated indirectly: TS/SCI
    # and DoD clearances are granted only to US citizens and cannot be sponsored, yet
    # such postings rarely use the explicit citizenship wording above. Match the
    # requirement, never the bare mention -- generic "clearance preferred" and "no
    # clearance required" are not disqualifying (id=28, calibration round
    # 2026-07-16-r1). But once a *specific* clearance level is named (Top Secret,
    # TS/SCI, Secret, DOE Q), reject regardless of required/preferred framing: no
    # framing makes an unobtainable clearance obtainable, and defense-adjacent
    # postings routinely name a level as a bare qualifications-list bullet with no
    # "active"/"required" wording at all. Evidence: id=83, calibration round
    # 2026-07-17-r1 (Booz Allen: "Must have: - Top Secret clearance" / "Preferred: -
    # TS / SCI clearance"), reached the scorer, which named the clearance a hard
    # disqualifier itself.
    clearance_required:
      - "\\bactive\\s+top[-\\s]?secret\\b"
      - "\\btop[-\\s]?secret\\s+cleared\\b"
      - "\\b(?:top[-\\s]?secret|TS\\s*/\\s*SCI|secret)\\s+clearance\\b"
      - "\\bability\\s+(?:to|and\\s+willingness\\s+to)\\s+obtain\\b[^.]{0,80}\\bclearance\\b"
      - "\\bmust\\s+(?:possess|have|hold|be\\s+able\\s+to\\s+obtain)\\b[^.]{0,60}\\bclearance\\b"
      - "(?<!no\\s)\\bclearance\\s+(?:is\\s+)?required\\b"
    positive_sponsorship:
      - "visa sponsorship (?:is )?available"
      - "we (?:can|will) sponsor"
    ambiguous:
      - "authorized to work in the (?:US|United States)"
flags:
  country_unknown: country_unknown
  start_date_unknown: start_date_unknown
  authorization_ambiguous: authorization_ambiguous
  opportunity_type_inferred: opportunity_type_inferred
